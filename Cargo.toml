[workspace]
members = ["crates/omni-common", "crates/omni-shell", "crates/omnidoc-core", "crates/omnicel-core", "crates/omnishow-core", "crates/omnidoc-ui", "crates/omnicel-ui", "crates/omnishow-ui", "crates/omnioffice-ui"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-only"

# Keep dev builds small (disk) and fast to link.
[profile.dev]
debug = 0
incremental = false
[profile.dev.package."*"]
opt-level = 1
