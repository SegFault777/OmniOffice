[package]
name = "omnidoc-ui"
description = "OmniDoc desktop UI: OS-native window (winit), Skia rendering, native file dialogs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omnidoc"
path = "src/main.rs"

[dependencies]
omnidoc-core = { path = "../omnidoc-core" }
omni-common = { path = "../omni-common" }
omni-shell = { path = "../omni-shell" }
winit = "0.30"
softbuffer = "0.4"
rfd = "0.15"
skia-safe = { version = "0.75", features = ["textlayout"] }
arboard = "3"
