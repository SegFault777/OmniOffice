name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p omnidoc-core
  app:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  target: linux,   bin: target/release/omnidoc}
          - {os: windows-latest, target: windows, bin: target/release/omnidoc.exe}
          - {os: macos-latest,   target: macos,   bin: target/release/omnidoc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries (fonts, native file dialogs)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libgtk-3-dev libxkbcommon-dev
      - run: cargo build --release -p omnidoc-ui
      - uses: actions/upload-artifact@v4
        with:
          name: omnidoc-${{ matrix.target }}
          path: ${{ matrix.bin }}
