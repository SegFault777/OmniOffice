name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned on purpose: a new stable compiler can break old transitive dependencies (see docs/dev/building.md).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libgtk-3-dev libxkbcommon-dev
      - run: cargo test --workspace
  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  target: linux,   ext: ""}
          - {os: windows-latest, target: windows, ext: ".exe"}
          - {os: macos-latest,   target: macos,   ext: ""}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned on purpose: a new stable compiler can break old transitive dependencies (see docs/dev/building.md).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Linux system libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libgtk-3-dev libxkbcommon-dev
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: omnioffice-${{ matrix.target }}
          path: |
            target/release/omnioffice${{ matrix.ext }}
            target/release/omnidoc${{ matrix.ext }}
            target/release/omnicel${{ matrix.ext }}
            target/release/omnishow${{ matrix.ext }}
